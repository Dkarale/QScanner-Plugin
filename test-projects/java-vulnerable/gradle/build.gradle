// TD-07b: Java Gradle project with known vulnerable dependencies
// Known CVEs: log4j-core (CVE-2021-44228), jackson-databind (CVE-2021-46877)
plugins {
    id 'java'
}

group = 'com.qualys.test'
version = '1.0.0'

repositories {
    mavenCentral()
}

configurations {
    runtimeClasspath {
        resolutionStrategy.activateDependencyLocking()
    }
}

dependencies {
    // CVE-2021-44228 (Log4Shell) — CRITICAL
    implementation 'org.apache.logging.log4j:log4j-core:2.14.1'
    // CVE-2021-46877 — HIGH
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.3'
}
